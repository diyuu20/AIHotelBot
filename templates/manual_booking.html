<!DOCTYPE html>
<html>
<head>
    <title>Enter Booking ID</title>

    <!-- ✅ USE YOUR EXISTING CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme-red.css') }}">

    <style>
        .center-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            padding: 40px;
            border-radius: 20px;
            text-align: center;

            /* 🔥 DARK GLASS */
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);

            /* 🔴 RED GLOW */
            border: 1px solid rgba(255, 0, 0, 0.3);
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.25);
        }

        h2 {
            color: white;
            font-size: 30px;
            margin-bottom: 25px;
        }

        input {
            width: 70%;
            padding: 10px;
            border-radius: 4px;
            border: none;
            outline: none;
            margin-bottom: 25px;
            text-align: center;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;

            /* 🔴 RED BUTTON */
            background: linear-gradient(135deg, #c1121f, #e01e37);
            color: white;

            box-shadow: 0 8px 20px rgba(193, 18, 31, 0.4);
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 30px rgba(193, 18, 31, 0.6);
        }
    </style>
</head>

<body>

<div class="background-container">

    <div class="center-box">
        <h2>Enter Your Booking ID</h2>

        <form action="/submit_booking_id" method="POST">
            <input type="text" name="booking_id" placeholder="Enter Booking ID" required>
            <br>
            <button class="btn" type="submit">Submit</button>
        </form>
    </div>

</div>

</body>
</html>
