<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images for Room {{ room_number }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            font-family: 'Segoe UI', sans-serif;
        }
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            padding: 20px;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
            border: 3px solid white;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .gallery-item img:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme-red.css') }}">
</head>
<body>
    <h1>Images for Room {{ room_number }}</h1>

    {% if image_paths %}
        <div class="gallery-container">
            {% for image_path in image_paths %}
                <div class="gallery-item">
                    <img src="{{ url_for('static', filename=image_path) }}" alt="Image of Room {{ room_number }}">
                </div>
            {% endfor %}
        </div>
    {% else %}
        <p style="text-align: center; font-size: 1.2em;">Sorry, no images are available for this room.</p>
    {% endif %}

</body>
</html>
